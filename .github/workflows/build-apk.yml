name: 构建 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不调用 setup-android / sdkmanager：它们会在无人环境里交互式
      # 要求接受许可而卡死。镜像自带 SDK，这里只补许可文件。
      - name: 准备 SDK 许可
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          mkdir -p "$SDK/licenses"
          printf '%s\n%s\n' \
            '24333f8a63b6825ea9c5514f83c2829b004d1fee' \
            '8933bad161af4178b1185d1a37fbf41ea5269c55' \
            > "$SDK/licenses/android-sdk-license"
          printf '%s\n' '84831b9409646a918e30573bab4c9c91346d8abd' \
            > "$SDK/licenses/android-sdk-preview-license"
          echo "SDK = $SDK"
          ls "$SDK" || true
          echo "--- platforms ---"
          ls "$SDK/platforms" || true
          echo "--- build-tools ---"
          ls "$SDK/build-tools" || true

      # 手动安装 Gradle，绕开 setup-gradle action 的守护进程包装
      - name: 安装 Gradle 8.9
        run: |
          set -e
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.5.0-bin.zip
          unzip -q -o /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-9.5.0/bin" >> $GITHUB_PATH
          "$HOME/gradle-9.5.0/bin/gradle" --version | head -5

      - name: 构建 Release APK
        run: gradle assembleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dfile.encoding=UTF-8

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: PerfMode-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
